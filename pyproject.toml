[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rhs-rcmtr"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = ["torch==2.5.1", "PyYAML==6.0.3", "numpy==2.4.6", "Pillow==12.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
